name: Refresh warehouse

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read and validate warehouse positions
        env:
          LUCRA_WAREHOUSE_SHEET_ID: ${{ secrets.LUCRA_WAREHOUSE_SHEET_ID }}
        run: python3 sync_sheet.py --link-shared

      - name: Prepare public files
        run: |
          mkdir -p _site/public
          cp index.html warehouse.css warehouse.js bundle-data.js .nojekyll _site/
          cp public/lucra-logo.png public/lucra-logo-square.png _site/public/
          sed -i -E "s/bundle-data\.js\?v=[^\"]+/bundle-data.js?v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/" _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish refreshed warehouse
        id: deployment
        uses: actions/deploy-pages@v4
