<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lucra Marble depo koridorlarında blok koduyla bundle bulun.">
  <title>Lucra Depo</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lucra Depo">
  <link rel="manifest" href="lucra-depo.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" href="public/lucra-logo-square.png">
  <link rel="stylesheet" href="warehouse.css?v=13">
  <script src="bundle-data.js?v=6" defer></script>
  <script src="warehouse.js?v=15" defer></script>
  <script src="install.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <img class="logo" src="public/lucra-logo.png" alt="Lucra Marble">
      <h1>Lucra Depo</h1>
      <form class="search" role="search">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4.1 4.1"/></svg>
        <input id="block-search" type="search" enterkeyhint="search" aria-label="Ürün adı, blok kodu veya konum ara" placeholder="Ürün, blok veya konum" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </form>
      <p id="status" class="sr-only" role="status"></p>
    </div>
  </header>
  <main class="shell">
    <div class="layout">
      <section class="panel map" aria-labelledby="map-title">
        <div class="map-header">
          <h2 id="map-title">Depo krokisi</h2>
          <p class="refresh-status"><span id="fresh-label">Son güncelleme</span><span id="stale-warning" hidden>Eski veri</span> <time id="last-updated"></time></p>
        </div>
        <div id="plan" class="plan" role="group" aria-label="Depo krokisi"></div>
      </section>
      <section class="lookup" aria-label="Arama sonuçları" hidden>
        <h2 id="result-title"></h2>
        <ul id="results" class="results"></ul>
        <p id="empty" class="empty" hidden></p>
      </section>
      <div id="install-area" class="install-area">
        <button id="install-app" type="button" aria-controls="install-help" aria-expanded="false">Ana ekrana ekle</button>
        <div id="install-help" hidden>
          <p><strong>iPhone</strong> · Safari’de Paylaş → Ana Ekrana Ekle → Web Uygulaması Olarak Aç → Ekle</p>
          <p><strong>Android</strong> · Chrome’da ⋮ → Yükle ve kısayol oluştur → Yükle</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
